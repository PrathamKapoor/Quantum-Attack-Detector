# Phase 3 dataset generation batch (PRE-REGISTERED in docs/dataset-spec-phase3.md
# BEFORE any Phase 3 test results were generated). Unpaired forecasting dataset:
# 20 independent seeds per definition; matched pairs from the Phase 2 batch are
# RETAINED as the COUNTERFACTUAL category (generated separately from phase1.yaml).

# --- unpaired attacks (seeds 100-119; independent env/channel/detector/noise) ---
shared:
  n_blocks: 2000
  horizons: [10, 25, 50, 100]

attack_seeds: [100, 101, 102, 103, 104, 105, 106, 107, 108, 109, 110, 111, 112, 113, 114, 115, 116, 117, 118, 119]
benign_seeds: [200, 201, 202, 203, 204, 205, 206, 207, 208, 209, 210, 211, 212, 213, 214, 215, 216, 217, 218, 219]

scenarios:
  # --- independent benign (hard negatives; §7) ---
  - name: plain
    class: normal
  - name: channel-drift
    class: normal
    env:
      fiber_loss_ou_sigma_db: 0.03
  - name: disturbance
    class: normal
    env:
      disturbance_episode_prob: 0.5
  # --- independent attacks (§6; no benign twins in the evaluation set) ---
  - name: intercept-resend
    class: attack
    sample_onset: [900, 1400]     # uniform per scenario seed
    sample:
      tap_fraction: [0.2, 0.5]
      resend_noise_mult: [1.5, 2.5]
  - name: lo-manipulation
    class: attack
    sample_onset: [900, 1400]
    sample:
      lo_attack_attenuation: [0.3, 0.7]
      lo_hidden_noise_factor: [0.3, 0.7]
      ramp_min_blocks: [40, 100]
      ramp_max_blocks: [100, 160]
  - name: calibration-manipulation
    class: attack
    sample_onset: [900, 1400]
    sample:
      cal_gain_bias: [0.05, 0.25]
      cal_offset_bias_snu: [0.02, 0.08]
      cal_ramp_min_blocks: [50, 120]
      cal_ramp_max_blocks: [120, 180]
  - name: channel-jamming-probes
    class: attack
    sample_onset: [900, 1400]
    sample:
      jamming_power_snu: [0.3, 0.8]
      probe_enabled: [true]
      probe_lambda: [1.0, 4.0]
      precursor_lead_blocks: [80, 140]
  - name: channel-jamming-sudden
    class: attack
    sample_onset: [900, 1400]
    sample:
      jamming_power_snu: [0.3, 0.8]
      probe_enabled: [false]
