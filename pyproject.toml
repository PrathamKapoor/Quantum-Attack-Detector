[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantumattack"
dynamic = ["version"]
description = "Research framework for causal attack monitoring, sequential detection, and early-warning evaluation in simulated CV-QKD systems."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "PrathamKapoor" }]
keywords = ["cv-qkd", "quantum-security", "anomaly-detection", "time-series", "research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "pyarrow>=15.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "scipy>=1.11"]
ml = ["torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "quantumattack.__version__" }   # single source of truth: src/quantumattack/__init__.py

[tool.pytest.ini_options]
testpaths = ["tests"]
